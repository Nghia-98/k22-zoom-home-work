<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../images/favicon_f8.edu.vn.png" />
    <title>Bài 1: Ghi nhớ giỏ hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6 text-center">
            <h1 class="text-2xl font-bold text-gray-800">Bài 1: Ghi nhớ giỏ hàng</h1>
            <a href="../index.html" class="text-blue-600 hover:text-blue-800 underline text-sm">&larr; Về trang Buổi 17</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Danh sách sản phẩm -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow-md p-6">
                <h2 class="font-semibold text-lg text-gray-800 mb-4">Danh sách sản phẩm</h2>
                <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- Giỏ hàng -->
            <div class="bg-white rounded-xl shadow-md p-6 space-y-4 lg:sticky lg:top-6 self-start max-h-[calc(100vh-3rem)] overflow-y-auto">
                <h2 class="font-semibold text-lg text-gray-800">Giỏ hàng</h2>
                <div id="cart-list" class="space-y-3"></div>
                <p id="cart-empty" class="text-gray-500 text-sm hidden">Giỏ hàng trống.</p>

                <div class="border-t pt-4 space-y-1">
                    <div class="flex justify-between text-gray-700">
                        <span>Tổng số lượng:</span>
                        <span id="cart-total-qty" class="font-medium">0</span>
                    </div>
                    <div class="flex justify-between text-gray-800 font-semibold">
                        <span>Tổng tiền:</span>
                        <span id="cart-total-price">0đ</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
