<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../images/favicon_f8.edu.vn.png" />
    <title>Bài 3: Danh sách sản phẩm từ server</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6 text-center">
            <h1 class="text-2xl font-bold text-gray-800">Bài 3: Danh sách sản phẩm từ server</h1>
            <a href="../index.html" class="text-blue-600 hover:text-blue-800 underline text-sm">&larr; Về trang Buổi 17</a>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <div id="status-area" class="hidden text-center py-10 space-y-3">
                <p id="status-text" class="text-gray-600"></p>
                <button id="retry-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-md px-4 py-2">
                    Thử lại
                </button>
            </div>

            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <!-- Modal chi tiết sản phẩm -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4 z-10">
        <div class="bg-white rounded-xl shadow-lg max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 space-y-3 relative">
            <button id="detail-close" class="absolute top-3 right-3 text-gray-400 hover:text-gray-700 text-xl leading-none">&times;</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
