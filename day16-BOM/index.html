<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/favicon_f8.edu.vn.png" />
    <title>Buổi 16: BOM</title>
    <!-- Tailwind CSS CDN mới nhất -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <!-- ===== View: Trang chủ ===== -->
    <div id="home-view" class="max-w-xl mx-auto space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6 text-center space-y-2">
            <h1 class="text-2xl font-bold text-gray-800">Buổi 16: BOM</h1>
            <p class="text-gray-600">
                Nội dung bài tập:
                <a href="https://f8.edu.vn/assignment-classes/217" target="_blank"
                   class="text-blue-600 hover:text-blue-800 underline font-medium">link đến trang bài tập</a>
            </p>
        </div>

        <!-- Card: thông tin đọc từ BOM -->
        <div class="bg-white rounded-xl shadow-md p-6 space-y-3">
            <h2 class="font-semibold text-lg text-gray-800 mb-2">Thông tin từ BOM</h2>

            <div class="flex justify-between border-b pb-2">
                <span class="text-gray-500">Vị trí người dùng</span>
                <span id="info-location" class="font-medium text-gray-800">Đang lấy vị trí...</span>
            </div>

            <div class="flex justify-between border-b pb-2 items-center">
                <span class="text-gray-500">Trạng thái mạng</span>
                <span class="flex items-center gap-2 font-medium text-gray-800">
                    <span id="online-dot" class="w-3 h-3 rounded-full bg-green-500"></span>
                    <span id="online-text">Online</span>
                </span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="text-gray-500">Trình duyệt</span>
                <span id="info-browser" class="font-medium text-gray-800"></span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="text-gray-500">Hệ điều hành</span>
                <span id="info-os" class="font-medium text-gray-800"></span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="text-gray-500">Ngôn ngữ</span>
                <span id="info-languages" class="font-medium text-gray-800"></span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="text-gray-500">Kích thước màn hình</span>
                <span id="info-screen-size" class="font-medium text-gray-800"></span>
            </div>

            <div class="flex justify-between">
                <span class="text-gray-500">Hướng màn hình</span>
                <span id="info-orientation" class="font-medium text-gray-800"></span>
            </div>
        </div>

        <!-- Banner quảng cáo: click sẽ reload sang campaign.html -->
        <a id="banner-link" href="campaign.html"
           class="block rounded-xl overflow-hidden shadow-md hover:shadow-xl hover:scale-[1.01] transition">
            <img src="https://picsum.photos/id/180/800/280" alt="Banner quảng cáo" class="w-full h-44 object-cover">
        </a>

        <!-- Nút chuyển sang view Fingerprinting (không reload, dùng pushState) -->
        <button id="go-fingerprint-btn"
                class="w-full px-4 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition">
            Xem Fingerprinting
        </button>
    </div>

    <!-- ===== View: Fingerprinting (ẩn ban đầu) ===== -->
    <div id="fingerprint-view" class="max-w-xl mx-auto space-y-6 hidden">
        <div class="bg-white rounded-xl shadow-md p-6 space-y-3">
            <h1 class="text-2xl font-bold text-gray-800">Fingerprinting</h1>
            <p class="text-sm text-gray-500">
                Chuỗi fingerprint được tạo bằng cách nối các thông tin đã đọc được ở trang chủ:
            </p>
            <p id="fingerprint-text" class="font-mono text-sm break-all bg-gray-50 border rounded-lg p-3"></p>
        </div>

        <button id="back-home-btn"
                class="w-full px-4 py-3 bg-gray-600 text-white rounded-lg font-medium hover:bg-gray-700 transition">
            Quay về trang chủ
        </button>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
